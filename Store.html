<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store</title>
  <link rel="stylesheet" href="style_1.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">TokoKamu</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Produk</a></li>
      <li><a href="#">Kontak</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <header class="hero">
    <h1>Koleksi Terbaru 2026</h1>
    <p>Temukan produk terbaik dengan harga terjangkau.</p>
  </header>

  <!-- Katalog Produk -->
  <main class="container">
    <h2 class="section-title">Produk Terlaris</h2>
    
    <div class="product-grid">
      <!-- Kartu Produk 1 -->
      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <h3>Sepatu Sneakers Casual</h3>
          <p class="price">Rp 450.000</p>
          <button class="btn-buy">Beli Sekarang</button>
        </div>
      </div>

      <!-- Kartu Produk 2 -->
      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <h3>Tas Ransel Waterproof</h3>
          <p class="price">Rp 299.000</p>
          <button class="btn-buy">Beli Sekarang</button>
        </div>
      </div>

      <!-- Kartu Produk 3 -->
      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <h3>Jaket Bomber Eksklusif</h3>
          <p class="price">Rp 550.000</p>
          <button class="btn-buy">Beli Sekarang</button>
        </div>
      </div>

      <!-- Kartu Produk 4 -->
      <div class="product-card">
        <div class="product-image"></div>
        <div class="product-info">
          <h3>Jam Tangan Minimalis</h3>
          <p class="price">Rp 899.000</p>
          <button class="btn-buy">Beli Sekarang</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
