<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusus Untuk Orang Cantik ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0c1b, #201335, #160a20);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }
        /* Efek Bintang Melayang */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.8;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        /* Kontainer Utama */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        /* Bingkai Foto */
        .photo-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
        }
        .photo-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff758c;
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.6);
        }
        .heart-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #ff758c;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Teks Cerita */
        .text-box {
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        #message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            transition: opacity 0.4s ease;
            opacity: 1;
        }
        /* Tombol */
        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Efek Bintang di Latar Belakang -->
    <div id="stars-container"></div>

    <!-- Kartu Ucapan -->
    <div class="card">
        <div class="photo-container">
            <!-- GANTI LINK DI BAWAH INI DENGAN LINK FOTO KAMU -->
            <img class="photo-frame" src="WA1.jpeg" alt="Foto Cantik">
            <div class="heart-badge">✨</div>
        </div>
        <h1>Hai, Orang Cantik! ✨</h1>
        <div class="text-box">
            <p id="message">Ada pesan kecil nih buat kamu yang selalu bersinar... Klik tombol di bawah ya!</p>
        </div>
        <button class="btn" onclick="nextMessage()">Klik di Sini ❤️</button>
    </div>

    <script>
        // Daftar kalimat pujian bergantian
        const messages = [
            "Cuma mau bilang, hari ini kamu kelihatan cantik banget seperti biasanya. 😊",
            "Senyuman kamu itu punya kekuatan magis yang bisa bikin hari yang mendung jadi cerah lagi.",
            "Nggak cuma parasmu yang cantik, tapi kebaikan hati kamu juga bikin semua orang nyaman di dekatmu.",
            "Terima kasih ya sudah selalu menjadi versi terbaik dari dirimu sendiri. Kamu berharga banget!",
            "Semoga harimu penuh dengan kebahagiaan, ya. Jangan lupa senyum hari ini! 💖"
        ];

        let currentIndex = -1;

        function nextMessage() {
            const messageEl = document.getElementById('message');
            messageEl.style.opacity = 0; // Efek memudar keluar
            
            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= messages.length) {
                    currentIndex = 0; // Mengulang dari awal jika sudah habis
                }
                messageEl.textContent = messages[currentIndex];
                messageEl.style.opacity = 1; // Efek memudar masuk
            }, 400);
        }

        // Membuat bintang tiruan melayang secara acak
        function createStars() {
            const container = document.getElementById('stars-container');
            const starCount = 30;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                star.style.width = star.style.height = Math.random() * 4 + 2 + 'px';
                star.style.animationDuration = Math.random() * 4 + 4 + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        createStars();
    </script>
</body>
</html>
