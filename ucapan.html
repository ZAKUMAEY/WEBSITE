<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Well Soon, Anisya Sabila! ✨</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --background: #f9f9ff;
            --text-main: #2d3436;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background Bubbles */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(108, 92, 231, 0.08);
            border-radius: 50%;
            animation: float Up 8s infinite ease-in-out;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

        .card {
            background: var(--card-bg);
            max-width: 500px;
            width: 90%;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(108, 92, 231, 0.1);
            text-align: center;
            z-index: 2;
            position: relative;
            border: 1px solid rgba(108, 92, 231, 0.1);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3);
            font-size: 35px;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3); }
            50% { transform: scale(1.05); box-shadow: 0 8px 30px rgba(108, 92, 231, 0.5); }
            100% { transform: scale(1); box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3); }
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .sub-title {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .message-box {
            background: #f1f2f6;
            padding: 20px;
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.6;
            color: #4b4b4b;
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border-left: 5px solid var(--primary);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.2);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #b2bec3;
        }
    </style>
</head>
<body>

    <div class="bubbles" id="bubbleContainer"></div>

    <div class="card">
        <div class="icon-box">🌸</div>
        <h1>Lekas Sembuh,</h1>
        <div class="sub-title">Anisya Sabila ✨</div>
        
        <div class="message-box" id="msgBox">
            Klik tombol di bawah ini untuk melihat pesan penyemangat dari kami ya, Sya!
        </div>

        <button class="btn" onclick="changeMessage()">Buka Pesan Semangat</button>
        
        <div class="footer-note">Dibuat khusus untuk Anisya Sabila</div>
    </div>

    <script>
        const messages = [
            "Hai Anisya Sabila! Sedih banget dengar kamu lagi kurang sehat. Semoga lekas pulih ya, Sya. Istirahat yang total dulu! ❤️",
            "Syafakillah untuk Anisya Sabila. Semoga Allah segera mengangkat penyakitmu dan mengembalikan senyum ceriamu seperti biasa. 🤲✨",
            "Jangan pikirkan tugas atau pekerjaan dulu ya, Sya. Yang paling penting sekarang adalah kesehatanmu. Semangat sembuh! 💪",
            "Sepi banget nggak ada kamu yang biasanya nemenin seru-seruan. Kami semua nungguin kamu pulih kembali di sini! 🥰🌸",
            "Minum obat yang teratur, makan makanan yang bergizi, dan istirahat yang cukup ya Anisya Sabila! We miss you! 🌟"
        ];

        let currentIndex = 0;

        function changeMessage() {
            const msgBox = document.getElementById('msgBox');
            
            // Animasi transisi teks
            msgBox.style.opacity = 0;
            msgBox.style.transform = "scale(0.95)";
            
            setTimeout(() => {
                msgBox.innerText = messages[currentIndex];
                msgBox.style.opacity = 1;
                msgBox.style.transform = "scale(1)";
                
                currentIndex = (currentIndex + 1) % messages.length;
            }, 300);
        }

        // Membuat dekorasi bubble melayang otomatis
        const container = document.getElementById('bubbleContainer');
        for (let i = 0; i < 15; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            
            const size = Math.random() * 40 + 20;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            bubble.style.animationDuration = `${Math.random() * 4 + 6}s`;
            
            container.appendChild(bubble);
        }
    </script>
</body>
</html>
